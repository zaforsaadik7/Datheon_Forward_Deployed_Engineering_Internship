global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/prometheus_rules.yml"

scrape_configs:
  - job_name: "fde-vpc-gateway"
    metrics_path: "/metrics"
    scheme: "http"
    authorization:
      type: "Bearer"
      credentials_file: "/run/secrets/fde_metrics_token"
    static_configs:
      - targets:
          - "fde-vpc-api:8000"
